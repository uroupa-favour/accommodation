services:
  - type: web
    name: oroupa-accommodation
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      # Uncomment DATABASE_URL if you create a Render PostgreSQL database below
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: oroupa-db
      #     property: connectionString

# Optional: Uncomment if you want Render to automatically provision a PostgreSQL instance
# databases:
#   - name: oroupa-db
#     plan: free

